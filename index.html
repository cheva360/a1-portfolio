    <!--copy email script-->
    <script>
    const emailEl = document.getElementById("copy-email");
    const email = emailEl.textContent.trim();

    function copyEmail() {
        navigator.clipboard.writeText(email).then(() => {
            emailEl.textContent = "Copied!";
            setTimeout(() => emailEl.textContent = email, 1500);

        });
        // needs to be able to copy with enter for accessibility

    }
    emailEl.addEventListener("click", copyEmail);
    emailEl.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {    
            copyEmail();
        }
    });
    </script>

    <!--modal script-->
    <!--modal script needs to be accessible with tab and enter keys?-->
    <script>
    const modal = document.getElementById("project-modal");
    const modalEmbed = document.getElementById("modal-embed");
    const modalTitle = document.getElementById("modal-title");
    const modalDesc = document.getElementById("modal-description");

    function openModal(item) {
        modalTitle.textContent = item.dataset.title;
        modalDesc.innerHTML = item.dataset.description;
        modalEmbed.src = item.dataset.embed;
        modal.classList.add("open");
        modal.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
        modal.classList.remove("open");
        modal.setAttribute("aria-hidden", "true");
        modalEmbed.removeAttribute("src"); // stops playback
    }

    document.querySelectorAll(".images").forEach(item => {
        item.addEventListener("click", () => openModal(item));
    });
    document.getElementById("modal-close").addEventListener("click", closeModal);
    modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
    </script>
